name: mil_classification
coarse_task_type: classification
description: >
  WSI classification using Multiple Instance Learning.
  Feature extractor (frozen) produces patch embeddings (N, D),
  aggregator computes slide-level logits via attention-based pooling.
  Matches PathLab's WSIClassificationTrainer.

template: classification_template.py
template_files:
  train.py: classification_template.py
  common/aggregators/__init__.py: common/aggregators/__init__.py
  common/aggregators/registry.py: common/aggregators/registry.py
  common/aggregators/base.py: common/aggregators/base.py
  common/aggregators/abmil.py: common/aggregators/abmil.py
  common/aggregators/clam.py: common/aggregators/clam.py
  common/aggregators/dsmil.py: common/aggregators/dsmil.py
  common/aggregators/transmil.py: common/aggregators/transmil.py
  common/aggregators/dtfdmil.py: common/aggregators/dtfdmil.py
  common/aggregators/meanmil.py: common/aggregators/meanmil.py
  common/aggregators/maxmil.py: common/aggregators/maxmil.py

task_types: [classification]

modifiable_zones:
  - model       # Only via PATHSCIENTIST_MIL_MODEL / explicit user architecture exploration
  - loss        # Loss function (CrossEntropy, focal, label smoothing)
  - hyperparams # lr, epochs, optimizer, scheduler, weight_decay

environment:
  extra_packages: []

dataset:
  format: feature_tensors            # pre-extracted features, not raw images
  structure:
    features: "{wsi_id}.pt"          # (N_patches, D) tensor per WSI
    splits: "splits.json"            # train/val/test partition + labels
  splits_schema:
    required_keys: [train, val, test, labels]
    labels_type: "int"               # class index (0, 1, ...)
    split_strategy: "random"         # random | stratified | kfold | case_level
    default_ratios: {train: 0.7, val: 0.1, test: 0.2}
  csv_format:                        # PathLab CSV upload format
    required_columns: [filename]
    optional_columns: [label, case_id, split, age, gender]
    example: |
      filename,split,label,case_id
      slide_001.svs,train,Tumor,CASE001
      slide_002.svs,val,Normal,CASE002
  feature_dim_by_extractor:
    ResNet50: 2048
    UNI: 1024
    UNI2: 1536
    CONCH: 512
    "CONCH 1.5": 512
    Virchow: 1280
    Virchow2: 1280
    Phikon: 1024
    Phikon2: 1024
    mSTAR: 1024
    GPFM: 1024
    "H-Optimus-0": 1536
    "H-Optimus-1": 1536
  mock_generator:
    n_samples: 20
    n_classes: 2
    n_patches_range: [50, 200]
    default_feature_dim: 1024

inputs:
  features_dir: /data/features/{extractor}     # {wsi_id}.pt files, shape (N_patches, D)
  splits_file: /data/splits.json   # {train:[], val:[], test:[], labels:{}}

outputs:
  metrics: /results/metrics.json
  model: /results/best_model.pth

evaluation:
  primary_metric: auc
  secondary_metrics: [accuracy, f1, precision, recall]

constraints:
  - "Model class must have forward(self, H) method"
  - "H shape: (N_patches, D) where D is the feature dimension (extractor-dependent)"
  - "Return: (logits, attention) where logits is (1, num_classes) and attention is (N,)"
  - "Do NOT modify FIXED zones (data loading, training loop, evaluation, result saving)"
  - "Keep all imports at the top of the file"
  - "Model must be .cuda() compatible"
  - "Batch size is 1 (one WSI bag per step) — do not use DataLoader batching"
  - "Class weights should be computed from label distribution for imbalanced data"
  - "Do NOT generate synthetic/mock/demo/dummy features, labels, or metrics when data is missing; fail with a data-readiness error instead."
  - "Use run_experiment to execute training; do NOT call python directly via terminal and then ratchet_commit — evidence would not be collected."
  - "Honor PATHSCIENTIST_MIL_MODEL from the execution plan. Do NOT switch ABMIL/CLAM/DSMIL/TransMIL/DTFD-MIL across iterations unless the user explicitly requests architecture exploration."
  - "PathLab uploads layout: when DATA_DIR points at PathLab's upload repository, raw slides live in wsi_files/, global feature cache lives in features/<extractor>/{wsi_id}.pt, task feature views may live in training/<task_id>/features/{wsi_id}.pt, coordinates in coordinates/{wsi_id}_coords.h5, slide metadata in metadata/{wsi_id}.json, masks in masks/, progress in progress/, and logs in logs/."

reference_code:
  aggregator: server/backend/ai/aggregators/abmil.py
  trainer: server/backend/ai/tasks/wsi_classification/trainer.py
  dataset: server/backend/ai/utils/feature_dataset.py

knowhow_tags: [classification, WSI, MIL, attention, ABMIL, TransMIL, CLAM, DSMIL]

# Plan-2026-04-30 data-readiness Task 9: when only raw WSI + labels are
# available, the orchestrator inserts feature_extraction as a setup step
# BEFORE this skill loads. The execution plan is the source of truth;
# this section is guidance only.
upstream_skill: feature_extraction

readiness_guidance:
  feature_ready_contract:
    features_dir: /data/features/{extractor}
    splits_file: /data/splits.json
  raw_wsi_contract:
    wsi_dir: /data/wsi_files
    labels_file: /data/labels.csv
  policy: >
    If feature tensors and splits are already provided, train MIL directly and
    do not rerun feature extraction. If only raw WSI and labels are provided,
    run feature_extraction first via feature_extraction_launcher.sh
    (script_type=bash, run_kind=feature_extraction), then point FEATURES_DIR at
    the generated PathLab feature leaf features/{extractor}
    for MIL training.
