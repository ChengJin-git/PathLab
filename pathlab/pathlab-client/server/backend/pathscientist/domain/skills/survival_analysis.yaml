name: survival_analysis
description: >
  WSI survival prediction using Multiple Instance Learning.
  Predicts discrete-time hazard logits from patch features,
  optimized with NLL survival loss, evaluated by concordance index.
  Matches PathLab's WSISurvivalTrainer.

template: survival_template.py

task_types: [survival]

modifiable_zones:
  - model       # Survival aggregator (attention + hazard head)
  - loss        # NLLSurvivalLoss, Cox loss, ranking loss
  - hyperparams # lr, epochs, num_bins, optimizer, scheduler

environment:
  extra_packages:
    - lifelines

dataset:
  format: feature_tensors
  structure:
    features: "{wsi_id}.pt"
    splits: "splits.json"
  splits_schema:
    required_keys: [train, val, test, survival_times, event_status]
    labels_type: "none"               # no class labels, use survival times
    split_strategy: "stratified"      # stratify by event_status
    default_ratios: {train: 0.7, val: 0.1, test: 0.2}
  csv_format:
    required_columns: [filename, event_time, event_status]
    optional_columns: [case_id, split, age, gender]
    example: |
      filename,split,event_time,event_status,case_id
      slide_001.svs,train,24.5,1,CASE001
      slide_002.svs,val,36.0,0,CASE002
  feature_dim_by_extractor:
    ResNet50: 2048
    UNI: 1024
    UNI2: 1536
    CONCH: 512
    Virchow: 1280
  mock_generator:
    n_samples: 20
    n_patches_range: [50, 200]
    default_feature_dim: 1024
    event_rate: 0.5                   # 50% events, 50% censored
    max_time: 60.0                    # months

inputs:
  features_dir: /data/features
  splits_file: /data/splits.json

outputs:
  metrics: /results/metrics.json
  model: /results/best_model.pth

evaluation:
  primary_metric: c_index
  secondary_metrics: []

constraints:
  - "Model class must have forward(self, H) method"
  - "H shape: (N_patches, D)"
  - "Return: (hazards, attention) where hazards is (1, num_bins) and attention is (N,)"
  - "num_bins is a hyperparameter (default 4), defines discrete time intervals"
  - "Do NOT modify FIXED zones"
  - "Survival time binning is done in FIXED code — do not reimplement"
  - "Loss function receives (hazards, time_bin_index, event_status)"

reference_code:
  trainer: server/backend/ai/tasks/wsi_survival/trainer.py
  loss: server/backend/ai/tasks/wsi_survival/losses.py

knowhow_tags: [survival, WSI, MIL, prognosis, c_index, hazard, NLL]
