[project]
name = "pathlab-server"
version = "0.1.0"
description = "PathLab Client server and backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangGraph / LangChain core
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.4.0",
    "langchain-mcp-adapters",

    # Deep Research - core
    "python-dotenv>=1.0.0",
    "json-repair>=0.30.0",
    "markdownify>=1.2.0",
    "readabilipy>=0.3.0",
    "pyyaml>=6.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",

    # Deep Research - search
    "tavily-python>=0.5.0",
    "langchain-tavily>=0.2.0",

    # Deep Research - providers & integrations
    "langchain-deepseek>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-experimental>=0.4.0",
    "langchain-milvus>=0.3.0",
    "langchain-qdrant>=1.0.0",
    "pymongo>=4.10.0",

    # Networking
    "aiohttp",
    "httpx>=0.27.0",

    # State / Cache
    "redis>=6.0.0",
]

[tool.uv]
dev-dependencies = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
