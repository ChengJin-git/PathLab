[project]
name = "pathlab-server"
version = "0.1.0"
description = "PathLab Client server and backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "tavily-python>=0.5.0",
    "aiohttp",
    "langchain-mcp-adapters",
]

[tool.uv]
dev-dependencies = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
