[project]
name = "pathlab-paper-agent"
version = "0.1.0"
description = "Standalone PathLab paper-generation agent runtime"
requires-python = ">=3.12,<3.13"
authors = [{ name = "PathLab" }]
dependencies = [
    "fastapi>=0.119.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0.34",
    "asyncpg>=0.30.0",
    "redis>=6.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.0",
    "numpy==1.26.4",
    "scipy>=1.13",
    "scikit-learn>=1.5.1",
    "pillow>=11",
    "aiofiles>=23",
    "loguru>=0.7",
    "coloredlogs>=15",
    "fastapi-users>=15.0.0",
    "fastapi-users-db-sqlalchemy>=7.0.0",
    "pyjwt>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
pathlab-paper-agent = "pathlab_paper_agent.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
dev = [
    { include-group = "test" },
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
