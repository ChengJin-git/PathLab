[project]
name = "pathlab-paper-generation"
version = "0.1.0"
description = "PathLab paper-generation agent (PaperOrchestra-aligned)"
requires-python = ">=3.12,<3.13"
authors = [{name = "PathLab"}]

# Runtime dependencies for the paper-generation agent.
#
# Aligned with PathLab's main `requirements.txt` for shared deps; we pin a
# narrower subset because paper-gen does NOT use torch / transformers /
# Aslide / openslide / segmentation-models-pytorch / marker-pdf — those are
# only needed by training, inference, segmentation, and the chat PDF RAG
# pipeline.
dependencies = [
    # Web framework (matches main PathLab versions)
    "fastapi>=0.119.0",
    "uvicorn>=0.38.0",
    "starlette>=0.48.0",
    "anyio>=4.0.0",

    # Auth (cross-imports from backend/auth/)
    "fastapi-users>=15.0.0",
    "fastapi-users-db-sqlalchemy>=7.0.0",
    "pyjwt>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",

    # DB
    "sqlalchemy>=2.0.34",
    "asyncpg>=0.30.0",

    # Cache / queue
    "redis>=6.0.0",

    # Templates (M4 / M5 Jinja2 renderer)
    "jinja2>=3.0",

    # HTTP client (LLM provider, S2/PubMed clients in M8a)
    "httpx>=0.27.0",

    # Numeric (transitive: backend.common.split_generation imports sklearn,
    # which needs numpy/scipy; M6a calibration_plot etc. need numpy too)
    "numpy==1.26.4",
    "scipy>=1.13",
    "scikit-learn>=1.5.1",

    # Image (M6a will use Pillow for figure manipulation; backend imports
    # also touch it)
    "pillow>=11",

    # Files
    "aiofiles>=23",

    # Logging
    "loguru>=0.7",
    "coloredlogs>=15",

    # Pydantic (FastAPI dep, but pinned so paper-gen schemas line up)
    "pydantic>=2.0",
]

[dependency-groups]
# Test deps (run with `uv run --group test pytest`)
test = [
    "aiosqlite>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

# Plotting deps for M6a empirical figure generators. Optional because some
# devs only work on M1-M5 / agents and don't need plotting.
plotting = [
    "matplotlib>=3.8",
    "lifelines>=0.30",  # KM curves + log-rank for M6a km_stratified.py
]

# Citations deps for M8a Semantic Scholar / PubMed clients. Optional.
citations = [
    # httpx already in main deps; nothing extra needed
]

# Convenience: install everything
dev = [
    {include-group = "test"},
    {include-group = "plotting"},
]

[tool.uv]
# Tell uv this is a "package" project (default in modern uv) — paper_generation
# itself is the package. We do NOT publish it; only used for local dev.
package = false

[tool.uv.sources]
# (none — backend/ and gateway/ live outside this folder; we make them
# importable via a .pth file at .venv setup time. See README.md.)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # Pydantic v2 deprecation noise from upstream FastAPI; not actionable here.
    "ignore::DeprecationWarning:pydantic.*",
]
