# PathLab Nginx Configuration (HTTP only)
# Deploy to: /etc/nginx/sites-available/pathlab
#
# TODO: Before deploying, replace the following:
#   - YOUR_DOMAIN: your domain name (e.g., pathlab.example.com)
#   - /path/to/pathlab-client: actual path to pathlab-client directory

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Frontend static files
    root /path/to/pathlab-client/src/renderer/dist;
    index index.html;

    # index.html - never cache, always re-fetch from server
    # This ensures users always get the latest script/style references after deployment
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Service Worker files - never cache so updates propagate immediately
    location ~* (sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Hashed assets (JS/CSS with content hash in filename) - cache forever
    # Vite generates unique filenames on each build, so stale cache is impossible
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    # Ensure index.html served via fallback also gets no-cache headers
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # API Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:6100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Preprocessing service
    location /preprocessing/ {
        proxy_pass http://127.0.0.1:6101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # AI service health check (special case - /health not /api/ai/health)
    location = /ai/health {
        proxy_pass http://127.0.0.1:6102/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI service (other routes)
    location /ai/ {
        proxy_pass http://127.0.0.1:6102/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    client_max_body_size 10G;
}

