# PathLab Nginx Configuration (HTTP only - for initial SSL setup)
# Use this first to get Let's Encrypt certificate, then switch to pathlab.conf
# Deploy to: /etc/nginx/sites-available/pathlab

server {
    listen 80;
    listen [::]:80;
    server_name pathlab.cse.ust.hk;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Frontend static files
    root /home/cjinag/code/PathLab/pathlab/pathlab-client/src/renderer/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:6100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Preprocessing service
    location /preprocessing/ {
        proxy_pass http://127.0.0.1:6101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # AI service
    location /ai/ {
        proxy_pass http://127.0.0.1:6102/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    client_max_body_size 10G;
}

