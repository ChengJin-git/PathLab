services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pathlab-postgres
    environment:
      POSTGRES_USER: pathlab
      POSTGRES_PASSWORD: pathlab
      POSTGRES_DB: pathlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pathlab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pathlab.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

