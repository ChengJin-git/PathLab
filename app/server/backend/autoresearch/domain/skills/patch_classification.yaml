name: patch_classification
coarse_task_type: classification
description: >
  Patch-level classification. Task granularity: each sample is one patch and
  the prediction target is the patch label, not a slide/bag label. The default
  representation is frozen pathology foundation model embeddings plus a
  trainable classifier head. Feature extraction is the patch representation
  step, not a slide-level MIL feature pipeline and not a separate task
  objective. Input prefers pre-extracted feature vectors (one .pt per patch);
  raw patch images may be materialized into cached embeddings before training.
  Adapt PathLab reference code for linear probes, classifier comparisons or
  justified encoder fine-tuning while retaining patch-level supervision.

template: patch_classification_template.py

task_types: [patch_classification]

modifiable_zones:
  - model       # Classifier head (Linear, MLP, Attention)
  - loss        # Loss function
  - hyperparams # lr, epochs, batch_size, optimizer
  - data_loading
  - preprocessing
  - training
  - evaluation
  - reporting

environment:
  extra_packages: []

dataset:
  format: feature_tensors
  structure:
    features: "{patch_id}.pt"          # (D,) vector per patch
    splits: "splits.json"
  splits_schema:
    required_keys: [train, val, test, labels]
    labels_type: "int"
    split_strategy: "case_level"      # group all patches/slides from a patient; stratify when feasible
    default_ratios: {train: 0.7, val: 0.15, test: 0.15}
  csv_format:
    required_columns: [filename]
    optional_columns: [label, split, case_id]
    example: |
      filename,split,label
      patch_001.png,train,Tumor
      patch_002.png,val,Normal
  feature_dim_by_extractor:
    # Pathology foundation models (preferred)
    UNI: 1024
    UNI2: 1536
    CONCH: 512
    "CONCH 1.5": 512
    Virchow: 1280
    Virchow2: 1280
    Phikon: 1024
    Phikon2: 1024
    mSTAR: 1024
    GPFM: 1024
    "H-Optimus-0": 1536
    "H-Optimus-1": 1536
    OpenMidnight: 1536
    # Vision-language pretrained
    PLIP: 512
    PathoCLIP: 512
    # Pathology specialized (domain-specific)
    SmartCCS: 1024
    SmartCyto: 768
    CytoFM: 768
    # ImageNet baselines (ablation only)
    ResNet50: 2048
    "ViT-L/16": 1024

inputs:
  dataset_manifest: "$PATHLAB_WORKSPACE/datasets/{dataset_id}/manifest.json"
  features_dir: "Actual per-patch feature paths from the manifest or completed extraction output"
  images_dir: "Actual patch image paths from the manifest, when embeddings are not available"
  splits_file: "Verified patient-separated patch splits and real labels from the manifest or a prepared workspace file"

outputs:
  metrics: "$OUTPUT_DIR/metrics.json"
  model: "$OUTPUT_DIR/best_model.pth"
  progress: "$OUTPUT_DIR/progress.json"

evaluation:
  primary_metric: accuracy
  secondary_metrics: [f1, precision, recall, auc]

constraints:
  - "Read /opt/pathlab/templates/patch_classification_template.py and the needed common code before adapting workspace source. Model, loader, preprocessing, loss and training changes are allowed for justified method comparisons; record the actual method and respect explicit user choices."
  - "Read real patch paths, labels, patient IDs and split assignments from the prepared dataset manifest. Inspect the reference loader and set DATA_DIR or PATHLAB_TRAINING_MANIFEST explicitly if reusing it, or write a manifest adapter; no DB access or automatic path translation is assumed."
  - "A frozen-encoder baseline uses one vector (D,) per patch, batched as (B, D), and returns logits (B, num_classes). Check actual tensor dimensions and label mapping. Preserve patch-level targets rather than silently treating slide labels as patch ground truth or switching to MIL."
  - "Frozen foundation features plus a linear/MLP head are a sanity baseline, not the scope of original methodological research. Select strong closest-method comparators from the actual literature. Change encoder, head, loss, augmentation or fine-tuning when the scientific hypothesis requires it; preserve fair tuning, adequate convergence and patient splits. Record the exact representation and preprocessing."
  - "Prefer pathology foundation models such as UNI2, CONCH, Virchow2, H-Optimus-1, GPFM or Phikon2. Use domain-specific models only for matching tissue/task domains and ImageNet models as informative baselines; verify available checkpoints, transforms and actual output dimensions rather than relying only on this catalog."
  - 'Use submit_experiment with a name and command argument array, for example ["python", "train.py"], for training or method comparisons. Use submit_computation for feature extraction, standalone evaluation or metrics; extraction consumes no experiment rounds. After valid Data Repo feature extraction completes, call register_features with dataset_id, features_dir and extractor, preserving manifest IDs. End the turn while waiting for jobs.'
  - "Jobs start in a read-only frozen source snapshot. Resolve existing inputs and earlier run outputs through PATHLAB_WORKSPACE and the manifest's actual paths; save all new files beneath OUTPUT_DIR. Write finite numeric split-specific metrics to metrics.json, training progress to progress.json and checkpoints there; update workspace notes from the agent afterwards."
  - "Use the single assigned GPU by default through PATHLAB_DEVICE (cuda:0 or cpu), preserving CUDA_VISIBLE_DEVICES. Do not enumerate host GPUs or select unassigned devices; tune batch size or accumulation to the allocated memory."
  - "On a missing Python dependency, inspect the log, call install_dependencies with packages and imports, verify success and retry. Submit Python scripts with python or python3 for the session environment. Set reference-specific variables in the script or wrapper; config is recorded metadata, not environment injection."
  - "Keep every patient's slides and derived patches in one split; verify real patient IDs and check duplicate/overlapping patches before training. Fit class weights, normalization and learned preprocessing on training patients only."
  - "Use validation data for model selection, early stopping, thresholds and calibration; never tune on held-out or external tests. Report per-class metrics and class imbalance, and use patient-clustered uncertainty where possible rather than treating correlated patches as independent patients."
  - "Do not generate synthetic images, features, labels or metrics. Missing real inputs, patch labels or patient mappings require diagnostics and request_help when user input is needed."

reference_code:
  trainer: server/backend/ai/tasks/patch_classification/trainer.py
  classifiers: server/backend/ai/classifiers/

upstream_skill: feature_extraction

recommended_feature_extractors:
  preferred: [Virchow2, UNI2, CONCH, "CONCH 1.5", "H-Optimus-1", GPFM, mSTAR, Phikon2]
  acceptable: [UNI, Virchow, Phikon, "H-Optimus-0", OpenMidnight]
  vision_language: [PLIP, PathoCLIP]            # only for text-aware tasks
  domain_specific:
    cervical: [SmartCCS]
    cytology: [SmartCyto, CytoFM]
  ablation_baseline: [ResNet50, "ViT-L/16"]      # useful comparison baselines
  rationale: >
    Pathology foundation models (Mahmood Lab UNI/CONCH, Paige Virchow,
    Bioptimus H-Optimus, HKUST GPFM/mSTAR, Owkin Phikon, ...) are strong
    starting points for histology classification. Verify performance on
    patient-separated validation data; gains are dataset-dependent.
    ImageNet baselines can provide a useful representation comparison.

knowhow_tags: [classification, patch, linear_probe, attention_classifier, foundation_model, UNI, CONCH, Virchow, Phikon, H-Optimus, GPFM, mSTAR, frozen_encoder]
